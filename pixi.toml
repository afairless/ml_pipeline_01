[workspace]
name = "ml-pipeline-template"
version = "0.1.0"
description = "A reusable batch machine-learning pipeline template."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
polars = ">=1.0,<2"
xgboost = ">=2.0,<3"
matplotlib = ">=3.8,<4"
scipy = ">=1.12,<2"
scikit-learn = ">=1.4,<2"

[feature.dev.dependencies]
pytest = ">=8.0,<9"
hypothesis = ">=6.100,<7"
ruff = ">=0.5,<1"
pyright = ">=1.1.380,<2"

[environments]
default = { features = ["dev"], solve-group = "default" }

[activation.env]
OMP_NUM_THREADS = "1"
